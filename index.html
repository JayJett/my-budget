<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&display=swap" rel="stylesheet">
<meta name="description" content="A friendly household budget visualiser.">
<!-- Installable app: name, icons, colours, full screen on iPhone, splash screens -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="My Budget">
<meta name="apple-mobile-web-app-title" content="My Budget">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1F1C" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="icons/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="stylesheet" href="css/app.css">
<!-- Supabase JS client: a pinned copy (2.45.4, from npm) kept in vendor/ so the app also opens offline. -->
<script src="vendor/supabase-js-2.45.4/supabase.js"></script>
<!-- The app itself: js/main.js and the files it imports. No build step. -->
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="auth" hidden></div>
<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="logo" aria-hidden="true"></div>
      <h1 class="brand" id="brandNames">Budget</h1>
      <div class="save-area">
        <button class="btn small undo-btn" id="undoBtn" type="button" hidden data-tip="Undo your last change"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.5 6.5h7a4 4 0 0 1 0 8H7"/></svg><span>Undo</span></button>
        <span class="save-state" id="saveState" tabindex="0"><span class="dot"></span><span class="txt" id="saveText">Loading…</span></span>
        <button class="btn icon" id="menuBtn" type="button" aria-label="More options" aria-haspopup="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="13" cy="8" r="1.6"/></svg></button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="meter" id="meter" hidden></div>
  </div>
</header>
<div class="conn-wrap"><div class="conn" id="conn" hidden></div></div>
<main id="app"></main>
<div class="pop" id="pop" hidden></div>
<div class="tt" id="tt" role="tooltip"></div>
<dialog id="sheet" class="sheet" aria-label="Settings"></dialog>
<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgP"></p><div class="acts"><button class="btn" type="button" id="dlgNo">Keep it</button><button class="btn danger" type="button" id="dlgYes">Remove</button></div></dialog>
<input type="file" id="importFile" accept=".html,.htm,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
