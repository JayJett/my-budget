<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarden + Madi · Budget v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F2F4EE; --surface:#FFFFFF; --surface-2:#F7F8F4; --ink:#1F2622; --muted:#5F675F; --faint:#98A095;
  --line:#E3E7DE; --line-strong:#CCD3C6;
  --accent:#2F6B4F; --accent-hover:#245840; --accent-soft:#E2EFE6; --on-accent:#FFFFFF;
  --jarden:#2F6DB5; --jarden-tint:#EDF4FC; --jarden-edge:#C3D7EE;
  --madi:#A9720A; --madi-tint:#FCF5E6; --madi-edge:#EAD3A3;
  --joint:#2C846B; --invest:#7A5AB0;
  --ok:#2E7A4B; --ok-soft:#E3F2E8; --warn:#A8650F; --warn-soft:#FBEEDA; --bad:#BE3A2C; --bad-soft:#FBE5E1;
  --attn:#E2672C; --unalloc:#D7DCD2;
  --shadow:0 1px 2px rgba(31,38,34,.05);
  --r-lg:16px; --r:12px; --r-sm:9px;
  --display:"Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1A1F1C; --surface-2:#1F2521; --ink:#E9EEE9; --muted:#A3ADA4; --faint:#6F7A71;
    --line:#2A322D; --line-strong:#3B453E;
    --accent:#86C69F; --accent-hover:#9DD4B2; --accent-soft:#1D3127; --on-accent:#0F1412;
    --jarden:#8AB7EA; --jarden-tint:#18222E; --jarden-edge:#2D4058;
    --madi:#E5B85E; --madi-tint:#241E12; --madi-edge:#4C3D1C;
    --joint:#6CC4A6; --invest:#B59EE0;
    --ok:#8FD3A6; --ok-soft:#18291F; --warn:#E9B86A; --warn-soft:#2B2314; --bad:#F2998C; --bad-soft:#2E1B18;
    --attn:#F08A55; --unalloc:#323A35; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1A1F1C; --surface-2:#1F2521; --ink:#E9EEE9; --muted:#A3ADA4; --faint:#6F7A71;
  --line:#2A322D; --line-strong:#3B453E;
  --accent:#86C69F; --accent-hover:#9DD4B2; --accent-soft:#1D3127; --on-accent:#0F1412;
  --jarden:#8AB7EA; --jarden-tint:#18222E; --jarden-edge:#2D4058;
  --madi:#E5B85E; --madi-tint:#241E12; --madi-edge:#4C3D1C;
  --joint:#6CC4A6; --invest:#B59EE0;
  --ok:#8FD3A6; --ok-soft:#18291F; --warn:#E9B86A; --warn-soft:#2B2314; --bad:#F2998C; --bad-soft:#2E1B18;
  --attn:#F08A55; --unalloc:#323A35; --shadow:none; color-scheme:dark;
}

/* ============ base ============ */
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 var(--body); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); }
button,input,select{ font:inherit; color:inherit; }
:focus{ outline:none; }
button:focus-visible, summary:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
body.is-dragging, body.is-dragging *{ cursor:grabbing !important; user-select:none; }

/* ============ header ============ */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:6; background:var(--surface); border-bottom:1px solid var(--line); }
.top-in{ max-width:1400px; margin:0 auto; padding:14px 28px 0; }
.brand-row{ display:flex; align-items:center; gap:14px; }
.logo{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center; flex:none; background:linear-gradient(135deg, var(--jarden) 0 50%, var(--madi) 50% 100%); color:#fff; font:750 15px var(--display); letter-spacing:-.04em; }
.brand{ font-family:var(--display); font-weight:750; font-size:1.2rem; letter-spacing:-.02em; margin:0; line-height:1.1; }
.brand .plus{ color:var(--faint); font-weight:500; margin:0 .15em; }
.brand .j{ color:var(--jarden); } .brand .m{ color:var(--madi); }
.brand small{ display:block; font:500 .75rem var(--body); color:var(--muted); letter-spacing:0; margin-top:2px; }
.ver{ display:inline-block; margin-left:6px; padding:1px 7px; border-radius:99px; background:var(--accent-soft); color:var(--accent); font:650 .68rem var(--body); vertical-align:2px; }
.save-area{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.save-state{ font-size:.78rem; color:var(--muted); display:flex; align-items:center; gap:6px; margin-right:4px; }
.save-state .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); }
.save-state.dirty{ color:var(--warn); } .save-state.dirty .dot{ background:var(--warn); }
.btn{ border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--r-sm); padding:7px 14px; font-weight:600; font-size:.85rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:background-color .12s, border-color .12s; }
.btn:hover{ background:var(--surface-2); border-color:var(--faint); }
.btn.primary{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.btn.primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
.btn.icon{ padding:7px 9px; }
.btn.small{ padding:4px 10px; font-size:.78rem; border-radius:8px; }
.btn.soft{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.btn.soft:hover{ background:var(--accent-soft); border-color:var(--accent); }

.tabs{ display:flex; gap:4px; margin-top:12px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tab{ border:0; background:none; padding:8px 12px 11px; cursor:pointer; color:var(--muted); font-weight:600; font-size:.88rem; border-bottom:2.5px solid transparent; white-space:nowrap; display:inline-flex; align-items:center; gap:7px; margin-bottom:-1px; border-radius:8px 8px 0 0; }
.tab svg{ width:16px; height:16px; flex:none; }
.tab:hover{ color:var(--ink); background:var(--surface-2); }
.tab[aria-selected="true"]{ color:var(--accent); border-bottom-color:var(--accent); }
.mark{ min-width:17px; height:17px; padding:0 5px; border-radius:99px; background:var(--attn); color:#fff; font:700 .66rem/17px var(--body); text-align:center; }
.mark:empty{ display:none; }

.meter{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; padding:10px 0 12px; border-top:1px solid var(--line); font-size:.82rem; }
.meter[hidden]{ display:none; }
.meter .lbl{ color:var(--muted); font-weight:600; }
.mt{ display:flex; align-items:center; gap:9px; }
.mt b{ font-weight:650; } .mt.j b{ color:var(--jarden); } .mt.m b{ color:var(--madi); }
.mt-bar{ width:120px; height:8px; border-radius:99px; background:var(--line); overflow:hidden; display:inline-block; }
.mt-bar span{ display:block; height:100%; border-radius:99px; transition:width .35s ease; }
.mt.j .mt-bar span{ background:var(--jarden); } .mt.m .mt-bar span{ background:var(--madi); }
.mt-v{ font-weight:650; min-width:44px; } .mt-v.ok{ color:var(--ok); } .mt-v.bad{ color:var(--bad); }

main{ max-width:1400px; margin:0 auto; padding:30px 28px 96px; }

/* ============ note + attention ============ */
.note-row{ display:flex; align-items:center; gap:8px; margin:0 0 22px; color:var(--muted); font-size:.85rem; flex-wrap:wrap; }
.note-input{ border:1px dashed transparent; background:transparent; border-radius:8px; padding:5px 8px; margin-left:-8px; color:var(--muted); font-size:.85rem; max-width:100%; field-sizing:content; min-width:220px; }
.note-input:hover{ border-color:var(--line-strong); }
.note-input:focus{ border-style:solid; border-color:var(--accent); background:var(--surface); color:var(--ink); }
.note-input:placeholder-shown{ width:220px; }
.note-x{ border:0; background:none; color:var(--faint); cursor:pointer; font-size:1rem; padding:2px 6px; border-radius:6px; }
.note-x:hover{ color:var(--bad); background:var(--bad-soft); }
.attn{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--attn); border-radius:var(--r); padding:14px 18px; margin:0 0 26px; }
.attn[hidden]{ display:none; }
.attn h3{ font-size:.95rem; display:flex; align-items:center; gap:8px; }
.attn ul{ margin:8px 0 0; padding-left:20px; color:var(--muted); font-size:.88rem; }
.attn li{ margin:3px 0; }
.attn li::marker{ color:var(--attn); }

/* ============ hero ============ */
.hero{ display:grid; grid-template-columns:repeat(3,1fr); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
.hero > .cell-h{ padding:22px 24px 20px; border-left:1px solid var(--line); }
.hero > .cell-h:first-child{ border-left:0; }
.fig-label{ font-size:.8rem; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.dotc{ width:10px; height:10px; border-radius:50%; flex:none; }
.fig{ font-family:var(--display); font-weight:650; font-size:2rem; line-height:1.1; letter-spacing:-.03em; display:flex; align-items:center; gap:6px; min-height:46px; }
.fig .cur{ font-size:1rem; color:var(--faint); font-weight:500; }
.fig input{ font:inherit; letter-spacing:inherit; text-align:right; width:7ch; flex:none; padding:3px 12px; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface); }
.fig input:hover{ border-color:var(--faint); }
.fig input:focus{ border-color:var(--accent); }
.fig.j input{ color:var(--jarden); background:var(--jarden-tint); border-color:var(--jarden-edge); }
.fig.m input{ color:var(--madi); background:var(--madi-tint); border-color:var(--madi-edge); }
.fig.j input:focus, .fig.m input:focus{ border-color:var(--accent); }
.fig-sub{ font-size:.8rem; color:var(--muted); margin-top:8px; }
.payday{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; font-size:.8rem; color:var(--muted); }
.payday input{ border:1px solid var(--line-strong); border-radius:8px; padding:3px 8px; background:var(--surface); font-size:.8rem; }
.payday input:focus{ border-color:var(--accent); }
.p27{ font-size:.78rem; color:var(--muted); margin-top:6px; }
.p27.hit{ color:var(--accent); font-weight:600; }
.ribbon{ grid-column:1/-1; display:flex; height:6px; background:var(--unalloc); }
.ribbon span{ display:block; height:100%; transition:width .35s ease; }
.ribbon-cap{ grid-column:1/-1; display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); padding:8px 24px 10px; font-weight:600; }

/* ============ stats ============ */
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; box-shadow:var(--shadow); }
.stat .k{ font-size:.8rem; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px; }
.stat .v{ font-family:var(--display); font-weight:650; font-size:1.6rem; letter-spacing:-.025em; line-height:1.2; margin-top:6px; }
.stat .s{ font-size:.78rem; color:var(--muted); margin-top:4px; }
.stat.big .v{ font-size:2rem; }
.stat.bad .v{ color:var(--bad); }
.stat input.stat-input{ font:inherit; letter-spacing:inherit; text-align:right; width:4.6ch; padding:1px 8px; margin-right:4px; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface); }
.stat input.stat-input:focus{ border-color:var(--accent); }

/* ============ sections ============ */
section{ margin-top:46px; }
.sec-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
h2{ font-family:var(--display); font-weight:650; font-size:1.25rem; letter-spacing:-.02em; margin:0; }
h3{ font-family:var(--display); font-weight:650; font-size:1rem; margin:0; }
.sec-note{ color:var(--muted); font-size:.85rem; flex-basis:100%; margin-top:-4px; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); }
.scroll{ overflow-x:auto; border-radius:var(--r-lg); }
.qi{ display:inline-grid; place-items:center; width:17px; height:17px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font:700 .66rem var(--body); cursor:help; flex:none; vertical-align:1px; margin-left:5px; text-transform:none; letter-spacing:0; }
.tip-t{ display:inline-flex; align-items:center; cursor:help; }

/* ============ tables ============ */
table{ width:100%; border-collapse:collapse; font-size:.86rem; }
th{ text-align:left; font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:12px 14px; border-bottom:1px solid var(--line); background:var(--surface-2); white-space:nowrap; vertical-align:bottom; }
th.num, td.num{ text-align:right; }
th.num .tip-t{ justify-content:flex-end; }
th .who{ display:block; flex-basis:100%; font-size:.72rem; font-weight:700; margin-bottom:2px; }
th .tip-t{ flex-wrap:wrap; } th.num .who{ text-align:right; }
th .who.j{ color:var(--jarden); } th .who.m{ color:var(--madi); }
td{ padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
tbody tr:last-child td{ border-bottom:0; }
tbody tr:hover td{ background:var(--surface-2); }
tfoot td{ border-top:1px solid var(--line-strong); border-bottom:0; font-weight:650; padding-top:13px; padding-bottom:11px; }
tfoot tr.check td{ border-top:0; font-weight:400; padding-top:0; padding-bottom:14px; font-size:.8rem; color:var(--muted); }
td.calc b{ font-weight:650; }
.dim{ color:var(--muted); }
.sub{ font-size:.72rem; color:var(--muted); margin-top:2px; white-space:nowrap; }
.sub.roll{ color:var(--accent); font-weight:600; }
.sub.spare{ color:var(--attn); font-weight:600; }
th:first-child, td:first-child{ padding-left:14px; }
td.c-grip{ width:28px; padding-right:0; }
tr.dragging td{ opacity:.45; }
tr.drop-before td{ box-shadow:inset 0 2px 0 var(--accent); }
tr.drop-after td{ box-shadow:inset 0 -2px 0 var(--accent); }

/* inline proportion bars */
td.pc{ position:relative; min-width:150px; }
td.pc .pv{ position:relative; z-index:1; }
.pbar{ position:absolute; left:10px; bottom:8px; height:4px; border-radius:2px; z-index:1; transition:width .3s ease; display:block; max-width:calc(100% - 20px); }
td.pc::after{ content:""; position:absolute; left:10px; right:10px; bottom:8px; height:4px; border-radius:2px; background:var(--line); opacity:.7; }
td.pc .pv{ display:inline-block; padding-bottom:6px; }
.pbar.j{ background:var(--jarden); opacity:.55; } .pbar.m{ background:var(--madi); opacity:.55; } .pbar.t{ background:var(--accent); opacity:.5; }
body.compact .pbar, body.compact td.pc::after{ bottom:4px; }

/* ============ inputs ============ */
.cell{ border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--r-sm); padding:8px 11px; width:100%; min-width:110px; font-size:.86rem; transition:border-color .12s; }
.cell:hover{ border-color:var(--faint); }
.cell:focus{ border-color:var(--accent); }
.cell::placeholder{ color:var(--faint); }
.cell.name{ font-weight:600; min-width:220px; }
.w-acc .cell.name{ min-width:290px; } .w-sp .cell.name{ min-width:180px; } .w-goal .cell.name{ min-width:120px; }
.cell.note{ min-width:130px; color:var(--muted); }
.w-sp .sub, .w-goal .sub{ white-space:normal; max-width:170px; line-height:1.35; }
.w-sp td, .w-sp th{ padding-left:8px; padding-right:8px; }
.w-goal td, .w-goal th{ padding-left:10px; padding-right:10px; }
.w-sp .unit{ padding:0 9px; } .w-sp .unit.wide input{ width:6.5ch; }
.w-sp select.cell{ min-width:100px; } .w-sp select.cell.month{ min-width:78px; } .w-sp .cell.name{ min-width:165px; } .w-sp .cell.note{ min-width:110px; }
.w-goal select.cell{ min-width:138px; } .w-goal input[type=date].cell{ min-width:124px; padding-left:8px; padding-right:6px; } .w-goal .cell.name{ min-width:112px; }
select.cell{ min-width:112px; appearance:none; -webkit-appearance:none; padding-right:28px; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%, calc(100% - 10px) 52%; background-size:4px 4px; background-repeat:no-repeat; }
select.cell option{ background:var(--surface); color:var(--ink); }
select.cell.month{ min-width:84px; }
input[type=date].cell{ min-width:132px; }
#rev{ width:auto; }
.unit{ display:inline-flex; align-items:center; justify-content:flex-end; gap:4px; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface); padding:0 11px; transition:border-color .12s; }
.unit:hover{ border-color:var(--faint); }
.unit:focus-within{ border-color:var(--accent); }
.unit i{ font-style:normal; color:var(--faint); font-size:.78rem; }
.unit input{ border:0; background:transparent; width:4.6ch; padding:8px 0; text-align:right; font-size:.86rem; }
.unit.wide input{ width:7.5ch; }
.w-goal .unit.wide input{ width:6ch; }
.unit.j{ background:var(--jarden-tint); border-color:var(--jarden-edge); } .unit.j input{ color:var(--jarden); }
.unit.m{ background:var(--madi-tint); border-color:var(--madi-edge); } .unit.m input{ color:var(--madi); }
.unit.j:focus-within, .unit.m:focus-within{ border-color:var(--accent); }
input[type=number]{ -moz-appearance:textfield; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.swatch{ width:4px; height:22px; border-radius:2px; display:inline-block; flex:none; }
.name-wrap{ display:flex; align-items:center; gap:9px; }
.grip{ border:0; background:none; color:var(--faint); cursor:grab; padding:4px 2px; border-radius:6px; touch-action:none; display:grid; place-items:center; }
.grip:hover{ color:var(--ink); background:var(--line); }
.grip svg{ width:12px; height:18px; }
.del{ border:0; background:none; color:var(--faint); cursor:pointer; width:28px; height:28px; border-radius:8px; font-size:1.1rem; line-height:1; opacity:0; }
tr:hover .del, .del:focus-visible{ opacity:1; }
@media (hover:none){ .del{ opacity:1; } }
.del:hover{ color:var(--bad); background:var(--bad-soft); }
.add{ display:inline-flex; align-items:center; gap:6px; border:1px dashed var(--line-strong); background:var(--surface); border-radius:var(--r-sm); padding:7px 13px; margin:14px 16px 16px; color:var(--muted); font-weight:600; font-size:.8rem; cursor:pointer; }
.add:hover{ color:var(--accent); border-color:var(--accent); border-style:solid; }
.fill-btn{ border:0; background:var(--accent-soft); color:var(--accent); border-radius:99px; padding:3px 10px; font-weight:650; font-size:.75rem; cursor:pointer; margin-left:6px; }
.fill-btn:hover{ background:var(--accent); color:var(--on-accent); }
.acw{ display:block; font-size:.72rem; color:var(--warn); margin-top:3px; font-weight:600; }
.acw:empty{ display:none; }

/* ============ status chips (soft, with a dot) ============ */
.chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 8px; border-radius:99px; font-size:.76rem; font-weight:650; background:var(--surface-2); color:var(--muted); white-space:nowrap; }
.chip::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.85; }
.chip.ok{ background:var(--ok-soft); color:var(--ok); } .chip.warn{ background:var(--warn-soft); color:var(--warn); }
.chip.bad{ background:var(--bad-soft); color:var(--bad); } .chip.info{ background:var(--jarden-tint); color:var(--jarden); }
.chip:empty{ display:none; }
.banner{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:var(--r); font-weight:600; font-size:.88rem; margin-top:18px; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line-strong); }
.banner.ok{ border-left-color:var(--ok); } .banner.warn{ border-left-color:var(--warn); } .banner.bad{ border-left-color:var(--bad); }
.banner:empty{ display:none; }
.bar{ width:100px; height:7px; background:var(--line); border-radius:99px; overflow:hidden; display:inline-block; vertical-align:middle; }
.bar span{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease; }

const TODAY = (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; })();
const $ = (s,r=document)=>r.querySelector(s), $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const n = v => (typeof v==="number" && isFinite(v)) ? v : 0;
const blank = v => v===null || v===undefined || v==="";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => "x" + Math.random().toString(36).slice(2,9);
function money(v, forceWhole){
  const r = Math.round(v*100)/100, whole = forceWhole || Math.abs(r-Math.round(r)) < 0.005;
  return (r < -0.004 ? "−" : "") + "$" + Math.abs(whole?Math.round(r):r).toLocaleString("en-NZ",{minimumFractionDigits:whole?0:2, maximumFractionDigits:whole?0:2});
}
const m0 = v => money(v, true);
const pct = (v,dp=0) => (v*100).toFixed(dp).replace(/\.0+$/,"") + "%";
const parseDate = s => { if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const monthYear = d => d.toLocaleDateString("en-NZ",{month:"short",year:"numeric"});
const addDays = (d,k) => { const x=new Date(d); x.setDate(x.getDate()+k); return x; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtNum = v => blank(v) ? "" : Number(v).toLocaleString("en-NZ",{maximumFractionDigits:2});
const trunc = (s,k) => s.length>k ? s.slice(0,k-1)+"…" : s;

/* ---------- bring older saved files up to v3 ---------- */
function migrate(s){
  s.version = 3;
  if(s.note === undefined) s.note = "All amounts in NZD, converted from AUD at 1 AUD = 1.2027 NZD (16 Aug 2026).";
  s.paydays = Object.assign({j:"", m:""}, s.paydays||{});
  s.invest = Object.assign({rate:0.07, growth:0, fee:0}, s.invest||{});
  (s.spend||[]).forEach(x=>{ if(!("due" in x)) x.due=null; if(!("aside" in x)) x.aside=null; });
  return s;
}

/* ---------- account colours: same colour = same account everywhere ---------- */
const FAM = {
  joint:["#2C846B","#55A88A","#86C5AC","#1D654F","#B2DCCA"],
  invest:["#7A5AB0","#9A7DC9","#5C4287","#C0AEE0"],
  jarden:["#2F6DB5","#5D93D0","#92B8E3","#1F4F85"],
  madi:["#C08510","#DDA944","#ECCB80","#8E620B"],
  other:["#C0603C","#D88A6B","#8E452B","#E6B39B"]
};
function colours(){
  const used={joint:0,invest:0,jarden:0,madi:0,other:0}, out={};
  state.accounts.forEach(a=>{
    const f = a.type==="Joint" ? "joint" : a.type==="Investment" ? "invest" : /jarden/i.test(a.name) ? "jarden" : /madi/i.test(a.name) ? "madi" : "other";
    out[a.id] = FAM[f][used[f]++ % FAM[f].length];
  });
  return out;
}

/* ---------- goals: finished goals pass their share to the next unfinished goal ---------- */
function allocGoals(goals, base){
  const eff = base.map(v=>v===null?null:v), from = goals.map(()=>[]), to = goals.map(()=>null);
  let spare = 0;
  const finished = goals.map(g=>!blank(g.name) && !blank(g.target) && Math.max(n(g.target)-n(g.saved),0)===0);
  const open = i => !blank(goals[i].name) && !finished[i];
  goals.forEach((g,i)=>{
    if(!finished[i] || !base[i]) return;
    let j = -1;
    for(let k=i+1;k<goals.length;k++) if(open(k)){ j=k; break; }
    if(j<0) for(let k=i-1;k>=0;k--) if(open(k)){ j=k; break; }
    if(j>=0){ eff[j] = n(eff[j]) + base[i]; from[j].push({name:g.name, v:base[i]}); to[i] = goals[j].name; }
    else { spare += base[i]; to[i] = ""; }
    eff[i] = 0;
  });
  return { eff, from, to, spare, finished };
}

/* ---------- 27-pay years ---------- */
function pay27(dateStr){
  const d = parseDate(dateStr); if(!d) return null;
  const y0 = TODAY.getFullYear(), out = [];
  for(let Y=y0; Y<=y0+20; Y++){
    const k = Math.ceil(Math.round((new Date(Y,0,1)-d)/864e5)/14);
    let p = addDays(d,k*14), c = 0;
    while(p.getFullYear()===Y){ c++; p = addDays(p,14); }
    if(c>=27) out.push(Y);
  }
  return out;
}

/* ---------- sinking funds with a due month ---------- */
function sinkInfo(s, fn){
  if(s.type!=="Sinking" || s.period!=="Year" || blank(s.due) || blank(s.name)) return null;
  const A = n(s.amount); if(A<=0) return null;
  let next = new Date(TODAY.getFullYear(), s.due-1, 1);
  if(next <= TODAY) next = new Date(TODAY.getFullYear()+1, s.due-1, 1);
  const last = new Date(next.getFullYear()-1, s.due-1, 1);
  const frac = (TODAY-last)/(next-last), expected = A*frac;
  const fnsAway = Math.max(1, Math.ceil((next-TODAY)/864e5/14));
  const info = { next, fnsAway, expected, A };
  if(blank(s.aside)){ info.st = {t:`Should have ${m0(expected)} by now`, c:"info"}; return info; }
  const diff = n(s.aside) - expected, tol = Math.max(2, A*0.02);
  if(n(s.aside) >= A) info.st = {t:"Ready to pay", c:"ok"};
  else if(Math.abs(diff) <= tol) info.st = {t:"On track", c:"ok"};
  else if(diff > 0) info.st = {t:`Ahead by ${m0(diff)}`, c:"ok"};
  else { info.behind = -diff; info.need = (A - n(s.aside))/fnsAway; info.st = {t:`Behind by ${m0(-diff)}`, c:"bad"}; }
  return info;
}

/* ---------- the model ---------- */
function compute(){
  const S=state, C={};
  const inc = { j:n(S.income.j), m:n(S.income.m) }; inc.c = inc.j+inc.m; C.inc=inc;
  const rows = S.accounts.map(a=>{ const je=n(a.j)*inc.j, me=n(a.m)*inc.m; return {...a, je, me, t:je+me}; });
  C.rows=rows;
  const row = id => rows.find(r=>r.id===id) || {je:0,me:0,t:0};
  C.tot = { jp:rows.reduce((s,r)=>s+n(r.j),0), mp:rows.reduce((s,r)=>s+n(r.m),0),
            je:rows.reduce((s,r)=>s+r.je,0), me:rows.reduce((s,r)=>s+r.me,0), t:rows.reduce((s,r)=>s+r.t,0) };
  C.maxT = Math.max(1, ...rows.map(r=>r.t));
  const byType = t => rows.filter(r=>r.type===t).reduce((s,r)=>s+r.t,0);
  C.joint=byType("Joint"); C.personal=byType("Personal"); C.investment=byType("Investment");
  C.cash = rows.filter(r=>/saving|buffer|goal|emergency/i.test(r.name)).reduce((s,r)=>s+r.t,0);
  C.pool = { js:row("js").t, ef:row("ef").t, jg:row("jg"), ji:row("ji").t, jpg:row("jpg").t, mpg:row("mpg").t };

  // fair split
  const shared = rows.filter(r=>r.type==="Joint"||r.type==="Investment");
  C.fair = { sj:shared.reduce((s,r)=>s+r.je,0), sm:shared.reduce((s,r)=>s+r.me,0),
    pj:rows.filter(r=>r.type==="Personal").reduce((s,r)=>s+r.je,0), pm:rows.filter(r=>r.type==="Personal").reduce((s,r)=>s+r.me,0),
    fj:rows.filter(r=>r.type==="Personal"&&/spend/i.test(r.name)).reduce((s,r)=>s+r.je,0), fm:rows.filter(r=>r.type==="Personal"&&/spend/i.test(r.name)).reduce((s,r)=>s+r.me,0) };

  // net worth
  const nw = S.nw.accounts, sumNW = t => nw.filter(a=>a.type===t).reduce((s,a)=>s+n(a.balance),0);
  C.nw = { op:sumNW("Operating"), sav:sumNW("Savings"), inv:sumNW("Investment"), sup:sumNW("Super"), debt:sumNW("Debt") };
  C.nw.assets = C.nw.op+C.nw.sav+C.nw.inv+C.nw.sup; C.nw.net = C.nw.assets-C.nw.debt; C.nw.cash=C.nw.op+C.nw.sav;
  const allGoals = [S.goals.ef, ...S.goals.joint, ...S.goals.jarden, ...S.goals.madi];
  C.earmark = {};
  nw.forEach(a=>{ C.earmark[a.id] = allGoals.filter(g=>g.account===a.name && !blank(a.name)).reduce((s,g)=>s+n(g.saved),0); });
  const counts = {}; nw.forEach(a=>{ const k=(a.name||"").trim().toLowerCase(); if(k) counts[k]=(counts[k]||0)+1; });
  C.dup = new Set(Object.keys(counts).filter(k=>counts[k]>1));
  C.savingsNames = nw.filter(a=>a.type==="Savings" && !blank(a.name)).map(a=>a.name);
  const rev = parseDate(S.nw.reviewed);
  C.reviewDue = !rev || (TODAY-rev)/864e5 > 30;

  // joint spending
  C.sp = S.spend.map(s=>{ const a=n(s.amount); const fn = blank(s.name) ? null : s.period==="Month" ? a*12/26 : s.period==="Year" ? a/26 : a; return {...s, fn}; });
  C.sp.forEach(s=>{ s.sink = sinkInfo(s, s.fn); });
  C.committed = C.sp.reduce((s,r)=>s+n(r.fn),0);
  C.spBuffer = C.pool.js - C.committed;
  C.spType = t => C.sp.filter(r=>r.type===t).reduce((s,r)=>s+n(r.fn),0);
  C.mCommitted = C.committed*26/12;

  // goals
  const jg = C.pool.jg;
  C.gj = allocGoals(S.goals.joint, S.goals.joint.map(g=> blank(g.name) ? null : n(g.j)*jg.je + n(g.m)*jg.me));
  C.gja = allocGoals(S.goals.jarden, S.goals.jarden.map(g=> blank(g.name) ? null : n(g.pct)*C.pool.jpg));
  C.gm = allocGoals(S.goals.madi, S.goals.madi.map(g=> blank(g.name) ? null : n(g.pct)*C.pool.mpg));

  // investments: fortnightly compounding, optional yearly contribution growth and fees
  const start = C.nw.inv, rate=n(S.invest.rate), fee=n(S.invest.fee), g=n(S.invest.growth), fn=C.pool.ji;
  const r=(rate-fee)/26, r0=rate/26;
  let bal=start, bal0=start, contrib=start;
  C.inv = { start, fn, rate, fee, g, years:[{y:0, contrib:start, bal:start, growth:0, mult:start?1:null, noFee:start}] };
  for(let y=1;y<=30;y++){
    const cy = fn*Math.pow(1+g, y-1);
    for(let k=0;k<26;k++){ bal = bal*(1+r)+cy; bal0 = bal0*(1+r0)+cy; contrib += cy; }
    C.inv.years.push({ y, contrib, bal, growth:bal-contrib, mult: contrib===0 ? null : bal/contrib, noFee:bal0 });
  }
  C.p27 = { j:pay27(S.paydays.j), m:pay27(S.paydays.m) };
  C.issues = issues(C);
  return C;
}

function goalStatus(g, perFN, isEF){
  if(blank(g.name)) return {t:"",c:""};
  if(blank(g.target)) return {t:"Needs a target",c:"warn"};
  const rem = Math.max(n(g.target)-n(g.saved),0);
  if(rem===0) return {t:"Done",c:"ok"};
  if(!perFN) return {t: isEF ? "Needs an amount" : "Needs a %", c:"warn"};
  if(!g.deadline) return {t:"ETA " + monthYear(addDays(TODAY, Math.ceil(rem/perFN)*14)), c:"info"};
  const dl = parseDate(g.deadline);
  if(dl <= TODAY) return {t:"Deadline passed",c:"bad"};
  const fns = (dl-TODAY)/864e5/14;
  if(perFN*fns >= rem) return {t:"On track for "+monthYear(dl),c:"ok"};
  return {t:"Needs "+m0(Math.ceil(rem/fns - perFN))+"/fn more",c:"bad"};
}
function nwStatus(a, em, C){
  if(blank(a.name)) return {t:"",c:""};
  if(C.dup.has(a.name.trim().toLowerCase())) return {t:"Duplicate name",c:"bad"};
  switch(a.type){
    case "Operating": return {t:"Operating cash",c:""};
    case "Investment": return {t:"Feeds Investments",c:"info"};
    case "Super": return {t:"Long-term wealth",c:""};
    case "Debt": return {t:"Liability",c:"bad"};
    case "Savings": {
      const b=n(a.balance);
      if(b===0) return {t:"Needs a balance",c:"warn"};
      if(em>b) return {t:"Over-earmarked by "+m0(em-b),c:"bad"};
      if(em<b) return {t:m0(b-em)+" not yet earmarked",c:"warn"};
      return {t:"Reconciled",c:"ok"};
    }
  }
  return {t:"",c:""};
}
const check100 = v => Math.round(v*1e4)===1e4 ? {t:"100%",c:"ok"} : {t:pct(v,1),c:"bad"};

/* ---------- attention list per tab ---------- */
function issues(C){
  const I = {budget:[], networth:[], spending:[], goals:[], invest:[]}, S=state;
  if(Math.round(C.tot.jp*1e4)!==1e4) I.budget.push(`Jarden’s allocation adds up to ${pct(C.tot.jp,1)}, not 100%.`);
  if(Math.round(C.tot.mp*1e4)!==1e4) I.budget.push(`Madi’s allocation adds up to ${pct(C.tot.mp,1)}, not 100%.`);
  if(C.reviewDue) I.networth.push("Balances haven’t been reviewed in over 30 days.");
  [...C.dup].forEach(k=>{ const a=S.nw.accounts.find(x=>(x.name||"").trim().toLowerCase()===k); I.networth.push(`“${a.name}” is used for more than one account, so goals tagged to it count twice.`); });
  S.nw.accounts.forEach(a=>{ if(a.type==="Savings" && C.earmark[a.id] > n(a.balance) && n(a.balance)>0) I.networth.push(`${a.name} is over-earmarked by ${m0(C.earmark[a.id]-n(a.balance))}.`); });
  if(C.spBuffer < -0.004) I.spending.push(`Joint spending is ${money(-C.spBuffer)} a fortnight over the pool.`);
  C.sp.forEach(s=>{ if(s.sink && s.sink.behind) I.spending.push(`${s.name} is behind by ${m0(s.sink.behind)}. Put aside ${money(s.sink.need)}/fn to be ready by ${monthYear(s.sink.next)}.`); });
  if(n(S.goals.ef.saved)>0 && C.mCommitted>0 && n(S.goals.ef.saved)/C.mCommitted < 3) I.goals.push("The emergency fund covers less than 3 months of committed joint costs.");
  const chk = (list, A, label) => {
    list.forEach((g,i)=>{ const st = goalStatus(g, A.eff[i], false); if(st.c==="bad") I.goals.push(`${g.name}: ${st.t.toLowerCase()}.`);
      if(!blank(g.name) && !blank(g.account) && !C.savingsNames.includes(g.account)) I.goals.push(`${g.name} is tagged to “${g.account}”, which isn’t a savings account.`); });
    if(A.spare > 0.004) I.goals.push(`${money(A.spare)}/fn of ${label} isn’t going to any goal, because every goal is finished.`);
  };
  chk(S.goals.joint, C.gj, "the joint goals fund"); chk(S.goals.jarden, C.gja, "Jarden’s goals pool"); chk(S.goals.madi, C.gm, "Madi’s goals pool");
  const efSt = goalStatus(S.goals.ef, C.pool.ef, true); if(efSt.c==="bad") I.goals.push(`Emergency fund: ${efSt.t.toLowerCase()}.`);
  return I;
}

/* ---------- builders ---------- */
function attrs(l,i,f,t){ return `data-l="${l}" data-i="${esc(i)}" data-f="${f}" data-t="${t}"`; }
function tIn(l,i,f,v,cls="",ph=""){ return `<input class="cell ${cls}" ${attrs(l,i,f,"text")} value="${esc(v)}" placeholder="${esc(ph)}" aria-label="${esc(ph||f)}">`; }
function pIn(l,i,f,v,tone=""){ const val = blank(v) ? "" : +(v*100).toFixed(4); return `<span class="unit ${tone}"><input type="number" step="any" inputmode="decimal" ${attrs(l,i,f,"pct")} value="${val}" aria-label="${f} percent"><i>%</i></span>`; }
function $In(l,i,f,v,tone=""){ return `<span class="unit wide ${tone}"><i>$</i><input type="text" inputmode="decimal" ${attrs(l,i,f,"num")} value="${fmtNum(v)}" aria-label="${f}"></span>`; }
function sIn(l,i,f,v,opts){ const o = opts.includes(v)||blank(v) ? opts : [v,...opts]; return `<select class="cell" ${attrs(l,i,f,"text")} aria-label="${f}">${blank(v)?'<option value=""></option>':""}${o.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select>`; }
function dIn(l,i,f,v){ return `<input type="date" class="cell" ${attrs(l,i,f,"date")} value="${esc(v||"")}" aria-label="${f}">`; }
function gAcc(l,g,savings){
  const opts = savings.map(x=>`<option${x===g.account?" selected":""}>${esc(x)}</option>`);
  if(!blank(g.account) && !savings.includes(g.account)) opts.unshift(`<option value="${esc(g.account)}" selected>${esc(g.account)} (not savings)</option>`);
  if(blank(g.account)) opts.unshift('<option value="" selected>Pick an account</option>');
  return `<select class="cell" ${attrs(l,g.id,"account","text")} aria-label="Account">${opts.join("")}</select>`;
}
const K = (k,cls="") => `<span data-k="${k}" data-base="${cls}" class="${cls}"></span>`;
const del = (l,i) => `<button class="del" type="button" data-del="${l}" data-i="${esc(i)}" aria-label="Remove row">×</button>`;
const grip = (l,i) => `<button class="grip" type="button" data-grip="${l}" data-i="${esc(i)}" aria-label="Drag to reorder, or use the arrow keys"><svg viewBox="0 0 12 18" fill="currentColor"><circle cx="3.5" cy="3.5" r="1.4"/><circle cx="8.5" cy="3.5" r="1.4"/><circle cx="3.5" cy="9" r="1.4"/><circle cx="8.5" cy="9" r="1.4"/><circle cx="3.5" cy="14.5" r="1.4"/><circle cx="8.5" cy="14.5" r="1.4"/></svg></button>`;
const tipq = t => `<span class="qi" tabindex="0" data-tip="${esc(t)}" aria-label="${esc(t)}">?</span>`;
const TH = (label, tip, cls="") => `<th class="${cls}">${tip ? `<span class="tip-t" tabindex="0" data-tip="${esc(tip)}">${label}<span class="qi" aria-hidden="true">?</span></span>` : label}</th>`;
const CORE = new Set(["js","ef","jg","ji","jpg","mpg"]);
function list(l){ return { acc:state.accounts, nw:state.nw.accounts, sp:state.spend, gj:state.goals.joint, gja:state.goals.jarden, gm:state.goals.madi, ef:[state.goals.ef] }[l]; }

function goalTable(key, goals, kind, A){
  const savings = compute.cache.savingsNames;

  const head = `<tr>${isEF?"":"<th></th>"}${TH("Goal","What you’re saving for. Higher in the list = higher priority.")}${TH("Target","How much the goal needs in total.","num")}${TH("Saved","How much is already put aside for it.","num")}${TH("Account","The savings account this money lives in. Only Savings accounts from Net worth are listed.")}
    ${isJoint ? TH('<span class="who j">Jarden</span>%',"Share of Jarden’s part of the joint goals fund.","num")+TH('<span class="who m">Madi</span>%',"Share of Madi’s part of the joint goals fund.","num") : isEF ? "" : TH("% of fund","Share of this person’s goals pool.","num")}
    ${TH("Per FN","Money going to this goal each fortnight, including any share passed down from finished goals above it.","num")}${TH("Remaining","Target minus saved.","num")}${TH("Deadline","Optional. Leave blank to see an estimated finish date instead.")}${TH("Status","Done, on track, or what’s needed to catch up.")}${isEF?"":"<th></th>"}</tr>`;
  const body = goals.map((g,i)=>`<tr>
    ${isEF?"":`<td class="c-grip">${grip(key,g.id)}</td>`}
    <td class="c-name" data-label="Goal">${isEF ? `<b>${esc(g.name)}</b>` : tIn(key,g.id,"name",g.name,"name","Goal name")}</td>
    <td class="num" data-label="Target">${$In(key,g.id,"target",g.target,tone)}</td>
    <td class="num" data-label="Saved">${$In(key,g.id,"saved",g.saved,tone)}</td>
    <td data-label="Account"><div>${gAcc(key,g,savings)}${K(`g.${g.id}.acw`,"acw")}</div></td>
    ${isJoint ? `<td class="num" data-label="Jarden %">${pIn(key,g.id,"j",g.j,"j")}</td><td class="num" data-label="Madi %">${pIn(key,g.id,"m",g.m,"m")}</td>` : isEF ? "" : `<td class="num" data-label="% of fund">${pIn(key,g.id,"pct",g.pct,tone)}</td>`}

    <td class="num" data-label="Remaining">${K(`g.${g.id}.rem`)}</td>
    <td data-label="Deadline">${dIn(key,g.id,"deadline",g.deadline)}</td>
    <td class="c-status"><div class="status-cell">${K(`g.${g.id}.st`,"chip")}<div class="prog"><span class="bar">${K(`g.${g.id}.bar`)}</span>${K(`g.${g.id}.pc`)}</div></div></td>
    ${isEF?"":`<td class="c-del">${del(key,g.id)}</td>`}</tr>`).join("");
  let foot = "", extra = "";
  if(isJoint) foot = `<tfoot><tr><td></td><td>Totals</td><td></td><td></td><td></td><td class="num">${K("gj.tj")}</td><td class="num">${K("gj.tm")}</td><td class="num">${K("gj.tfn")}</td><td></td><td></td><td></td><td></td></tr>

  return `<div class="panel ${isEF?"":"scroll"} w-goal"><div class="${isEF?"scroll":""}"><table><thead>${head}</thead><tbody>${body}</tbody>${foot}</table></div>${extra}${isEF?"":`<button class="add" type="button" data-add="${key}">+ Add a goal</button>`}</div>`;

/* ---------- charts ---------- */
function donutSVG(slices, total, label){
  const R=88, r=58, cx=100, cy=100, sum = slices.reduce((s,x)=>s+x.v,0);
  let a0 = -Math.PI/2, paths="";
  if(sum<=0){ paths = `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" style="stroke:var(--unalloc)" stroke-width="${R-r}"/>`; }
  else slices.forEach(s=>{
    if(s.v<=0) return;
    const frac=s.v/sum, a1=a0+frac*Math.PI*2, fill = s.un ? `style="fill:var(--unalloc);stroke:var(--surface)"` : `fill="${s.col}" style="stroke:var(--surface)"`;
    if(frac>0.9999){ paths += `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${s.col}" stroke-width="${R-r}"><title>${esc(s.name)}: ${money(s.v)}</title></circle>`; a0=a1; return; }

    paths += `<path d="M${p(R,a0)} A${R} ${R} 0 ${lg} 1 ${p(R,a1)} L${p(r,a1)} A${r} ${r} 0 ${lg} 0 ${p(r,a0)}Z" ${fill} stroke-width="2"><title>${esc(s.name)}: ${money(s.v)} (${pct(frac)})</title></path>`;

/* Money flow (Sankey): pays → accounts → joint spending categories */
function drawFlow(C, col){
  const el=$("#flow"); if(!el) return;
  const W=1000, NW=12, pad=18, gM=10, gR=7, xL=150, xM=460, xR=768;
  const L=[{key:"J",name:"Jarden",v:C.inc.j,c:"var(--jarden)"},{key:"M",name:"Madi",v:C.inc.m,c:"var(--madi)"}].filter(x=>x.v>0);
  const mid=C.rows.filter(r=>r.t>0.004).map(r=>({key:r.id,name:r.name||"Unnamed",v:r.t,je:r.je,me:r.me,c:col[r.id]}));
  const unJ=Math.max(C.inc.j-C.tot.je,0), unM=Math.max(C.inc.m-C.tot.me,0);
  if(unJ+unM>0.5) mid.push({key:"un",name:"Not allocated",v:unJ+unM,je:unJ,me:unM,c:"var(--unalloc)",un:true});
  const totL=L.reduce((a,x)=>a+x.v,0), totM=mid.reduce((a,x)=>a+x.v,0);
  if(totL<=0||totM<=0){ el.innerHTML='<p class="empty">Add your pays and allocations above to see the money flow.</p>'; return; }
  const js=mid.find(m=>m.key==="js");
  let right=[];
  if(js){ right=C.sp.filter(s=>n(s.fn)>0.004).map(s=>({key:s.id,name:s.name,v:s.fn,c:col.js})); if(C.spBuffer>0.5) right.push({key:"buf",name:"Buffer",v:C.spBuffer,c:"var(--unalloc)",un:true}); }
  const totR=right.reduce((a,x)=>a+x.v,0), over = js && totR>js.v+0.01, sR = over ? js.v/totR : 1;
  const H=Math.max(380, Math.max(mid.length,right.length)*40+2*pad);
  let k=Math.min((H-2*pad-gM*(L.length-1))/totL, (H-2*pad-gM*(mid.length-1))/totM);
  if(right.length) k=Math.min(k,(H-2*pad-gR*(right.length-1))/(totR*sR));
  const stack=(arr,gap,start)=>{ let y=start; arr.forEach(x=>{ x.h=Math.max(x.v*k*(x.s||1),1.5); x.y=y; y+=x.h+gap; }); return y-gap-start; };
  const hL=L.reduce((a,x)=>a+Math.max(x.v*k,1.5),0)+gM*(L.length-1); stack(L,gM,(H-hL)/2);
  const hM=mid.reduce((a,x)=>a+Math.max(x.v*k,1.5),0)+gM*(mid.length-1); stack(mid,gM,(H-hM)/2);
  if(right.length){ right.forEach(x=>x.s=sR); const raw=right.reduce((a,x)=>a+Math.max(x.v*k*sR,1.5),0); const gR2 = right.length>1 ? Math.min(22, Math.max(gR, (H-2*pad-raw)*0.75/(right.length-1))) : 0; const hR=raw+gR2*(right.length-1); const gUse=gR2; let st=js.y+js.h/2-hR/2; st=Math.max(pad,Math.min(H-pad-hR,st)); stack(right,gUse,st); }
  const band=(x0,y0,x1,y1,h)=>{ const xm=(x0+x1)/2; return `M${x0},${y0}C${xm},${y0} ${xm},${y1} ${x1},${y1}L${x1},${y1+h}C${xm},${y1+h} ${xm},${y0+h} ${x0},${y0+h}Z`; };
  let links="", nodes="", labels="";
  const off={}; L.forEach(x=>off[x.key]=x.y);
  mid.forEach(m=>{ let my=m.y;
    [["J",m.je,"var(--jarden)","Jarden"],["M",m.me,"var(--madi)","Madi"]].forEach(([src,v,c,who])=>{ if(v<=0.004 || off[src]===undefined) return; const h=v*k;
      links+=`<path class="flow-link" d="${band(xL+NW,off[src],xM,my,h)}" fill="${c}" style="fill:${c};opacity:.28"><title>${who} → ${esc(m.name)}: ${money(v)}</title></path>`; off[src]+=h; my+=h; }); });
  if(js){ let jy=js.y; right.forEach(r=>{ const h=r.v*k*sR; links+=`<path class="flow-link" d="${band(xM+NW,jy,xR,r.y,h)}" style="fill:${r.un?"var(--faint)":col.js};opacity:${r.un?.22:.3}"><title>Joint spending → ${esc(r.name)}: ${money(r.v)}</title></path>`; jy+=h; }); }
  const node=(x,o)=>`<rect x="${x}" y="${o.y}" width="${NW}" height="${o.h}" rx="3" style="fill:${o.c}"><title>${esc(o.name)}: ${money(o.v)}</title></rect>`;
  const place = arr => { const ys=arr.map(o=>({o, two:o.h>=22, y:o.y+o.h/2})); ys.forEach(q=>q.lh=q.two?30:15);
    for(let i=1;i<ys.length;i++){ const min=ys[i-1].y+(ys[i-1].lh+ys[i].lh)/2+2; if(ys[i].y<min) ys[i].y=min; }
    for(let i=ys.length-1;i>=0;i--){ const max = i===ys.length-1 ? H-ys[i].lh/2 : ys[i+1].y-(ys[i+1].lh+ys[i].lh)/2-2; if(ys[i].y>max) ys[i].y=max; }
    ys.forEach(q=>{ q.o.ly=q.y; q.o.two=q.two; }); };
  place(mid); place(right);
  const lab=(x,o,anchor,amt)=>{ const cy=o.ly!==undefined?o.ly:o.y+o.h/2, nm=esc(trunc(o.name,30)), lead = o.ly!==undefined && Math.abs(o.ly-(o.y+o.h/2))>2 ? `<path d="M${anchor==="start"?x-7:x+7},${o.y+o.h/2} L${anchor==="start"?x-2:x+2},${cy}" style="stroke:var(--faint);fill:none" stroke-width="1"/>` : ""; const style='paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round';
    return lead + ((o.two!==undefined ? o.two : o.h>=22) ? `<text x="${x}" y="${cy-3}" text-anchor="${anchor}" style="fill:var(--ink);font:600 12px var(--body);${style}">${nm}</text><text x="${x}" y="${cy+12}" text-anchor="${anchor}" style="fill:var(--muted);font:11px var(--body);${style}">${amt}</text>`
                   : `<text x="${x}" y="${cy+4}" text-anchor="${anchor}" style="fill:var(--ink);font:600 11.5px var(--body);${style}">${nm} <tspan style="fill:var(--muted);font-weight:400">${amt}</tspan></text>`); };
  L.forEach(o=>{ nodes+=node(xL,o); labels+=lab(xL-10,o,"end",m0(o.v)); });
  mid.forEach(o=>{ nodes+=node(xM,o); labels+=lab(xM+NW+8,o,"start",money(o.v)); });
  right.forEach(o=>{ nodes+=node(xR,o); labels+=lab(xR+NW+8,{...o,name:trunc(o.name,25)},"start",money(o.v)); });
  const heads=`<text x="${xL+NW/2}" y="12" text-anchor="middle" style="fill:var(--faint);font:600 10.5px var(--body);letter-spacing:.06em">PAY</text><text x="${xM+NW/2}" y="12" text-anchor="middle" style="fill:var(--faint);font:600 10.5px var(--body);letter-spacing:.06em">ACCOUNTS</text>${right.length?`<text x="${xR+NW/2}" y="12" text-anchor="middle" style="fill:var(--faint);font:600 10.5px var(--body);letter-spacing:.06em">JOINT SPENDING</text>`:""}`;
  const warn = over ? `<text x="${xR}" y="${H-4}" style="fill:var(--bad);font:600 11px var(--body)">Committed is ${money(totR-js.v)} more than the pool</text>` : "";
  el.innerHTML = `<svg viewBox="0 -6 ${W} ${H+12}" role="img" aria-label="Money flow from pay to accounts to joint spending">${heads}${links}${nodes}${labels}${warn}</svg>`;
}

function niceMax(v){ if(v<=0) return 1000; const e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; }
const short = v => v>=1e6 ? "$"+(v/1e6).toFixed(v>=1e7?0:1).replace(/\.0$/,"")+"M" : v>=1e3 ? "$"+Math.round(v/1e3)+"k" : "$"+Math.round(v);
function drawCurve(C){
  const el=$("#curve"); if(!el) return;
  const Y=C.inv.years, W=820, H=320, pl=58, pr=16, pt=12, pb=34;
  const max=niceMax(Math.max(...Y.map(d=>Math.max(d.bal,d.contrib))));

  let grid="";
  for(let i=0;i<=4;i++){ const v=max*i/4; grid+=`<line x1="${pl}" x2="${W-pr}" y1="${yv(v)}" y2="${yv(v)}"/><text x="${pl-10}" y="${yv(v)+4}" text-anchor="end">${short(v)}</text>`; }
  for(const y of [0,5,10,15,20,25,30]) grid+=`<text x="${x(y)}" y="${H-10}" text-anchor="middle">${y===0?"Now":"Yr "+y}</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="30-year investment projection">
    <defs><linearGradient id="ig" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--invest);stop-opacity:.25"/><stop offset="1" style="stop-color:var(--invest);stop-opacity:0"/></linearGradient></defs>
    <g class="axis">${grid}</g>
    <path d="${line("bal")} L${x(30)} ${yv(0)} L${x(0)} ${yv(0)}Z" fill="url(#ig)"/>
    <path d="${line("contrib")}" fill="none" style="stroke:var(--faint)" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="${line("bal")}" fill="none" style="stroke:var(--invest)" stroke-width="2.5" stroke-linejoin="round"/>
    <g id="hov" style="opacity:0"><line id="hl" y1="${pt}" y2="${H-pb}" style="stroke:var(--line-strong)"/><circle id="hb" r="5" style="fill:var(--invest);stroke:var(--surface)" stroke-width="2"/><circle id="hc" r="4" style="fill:var(--faint);stroke:var(--surface)" stroke-width="2"/></g>
    <rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>`;
  const svg=$("svg",el), tip=$("#tip"), hov=$("#hov");
  $("#hit").addEventListener("pointermove", ev=>{
    const b=svg.getBoundingClientRect(), sx=(ev.clientX-b.left)*(W/b.width);
    const yr=Math.max(0,Math.min(30,Math.round((sx-pl)/(W-pl-pr)*30))), d=Y[yr];
    ["x1","x2"].forEach(a=>$("#hl").setAttribute(a,x(yr)));
    $("#hb").setAttribute("cx",x(yr)); $("#hb").setAttribute("cy",yv(d.bal)); $("#hc").setAttribute("cx",x(yr)); $("#hc").setAttribute("cy",yv(d.contrib));
    hov.style.opacity=1;
    tip.innerHTML=`<b>${yr===0?"Now":"Year "+yr}</b><br>Balance ${m0(d.bal)}<br>Contributed ${m0(d.contrib)}<br>Growth ${m0(d.growth)}`;
    tip.style.left=(x(yr)/W*b.width+18)+"px"; tip.style.top=(yv(d.bal)/H*b.height+10)+"px"; tip.classList.add("on");
  });
  $("#hit").addEventListener("pointerleave",()=>{ hov.style.opacity=0; tip.classList.remove("on"); });
}

let drag=null;

  rows.forEach(r=>r.classList.remove("drop-before","drop-after"));

function endDrag(commit){

  document.body.classList.remove("is-dragging");
  if(commit && to!==null && from>-1){ if(to>from) to--; if(to!==from){ const [it]=L.splice(from,1); L.splice(to,0,it); setDirty(true); } }
  drag=null; render();
}

  if(i<0||j<0||j>=L.length) return; [L[i],L[j]]=[L[j],L[i]]; setDirty(true); render();

  C.sp.forEach(s=>row([s.name,s.type,n(s.amount),s.period,s.fn===null?"":r2(s.fn),s.due?MONTHS[s.due-1]:"",blank(s.aside)?"":s.aside,s.notes])); row(["Committed","","","",r2(C.committed)]); row([]);

  row(["INVESTMENTS","Return %",r2(C.inv.rate*100),"Growth %",r2(C.inv.g*100),"Fees %",r2(C.inv.fee*100)]); row(["Year","Contributed","Balance","Growth"]);
  C.inv.years.slice(1).forEach(d=>row([d.y,Math.round(d.contrib),Math.round(d.bal),Math.round(d.growth)]));
  offerFile(`Jarden_Madi_Budget_v3_${ymd(TODAY)}.csv`, "\ufeff"+out.join("\r\n"), "CSV");
}
function exportJSON(){ const {tab, ui, ...rest} = state; offerFile(`Jarden_Madi_Budget_v3_backup_${ymd(TODAY)}.json`, JSON.stringify(rest, null, 1), "Backup"); }
function offerFile(filename, data, label){
  const type = filename.endsWith(".csv") ? "text/csv" : "application/json";
  const blob=new Blob([data],{type}), a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast(`${label} downloaded`);
}

/* ---------- import from an earlier version ---------- */
$("#importFile").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const txt=await f.text(); let json=null;
    const m=txt.match(/<script id="budget-data"[^>]*>([\s\S]*?)<\/script>/);
    json = JSON.parse(m ? m[1] : txt);
    if(!json || !json.accounts || !json.income) throw new Error("no budget");
    if(hasData && !(await confirmDel("Replace the current budget?", "Every number here will be swapped for the ones in this file, for both of you.", "Replace"))) return;
    const keepUI=state.ui, keepTab=state.tab; delete json.ui; delete json.tab; delete json.savedAt; state=migrate(json); state.ui=keepUI; state.tab=keepTab;
    setDirty(true); render(); toast("Imported and saved.");
  }catch(err){ toast("That file doesn’t contain budget data. Pick a saved budget .html file."); }
});

/* ---------- accounts + syncing (Supabase) ---------- */
let sb=null, session=null, household=null, members=[], channel=null, recovering=false, entering=false;
const configured = /^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/i.test(SUPABASE_URL.trim()) && SUPABASE_ANON_KEY.trim().length > 30;
const here = () => location.origin + location.pathname;
const sharedState = () => { const {tab, ui, savedAt, ...rest} = state; return clone(rest); };
function showConn(msg){ const c=$("#conn"); c.textContent=msg||""; c.hidden=!msg; }

function scheduleSave(){
  if(!household){ return; }
  clearTimeout(writeTimer); setStatus("Saving…","wait");
  writeTimer = setTimeout(()=>{ writeTimer=null; flush(); }, 800);
}
async function flush(retried){
  if(!household) return;
  if(writing){ writeAgain=true; return; }
  writing=true;
  const rev=uid(); lastRev=rev; const at=new Date().toISOString();
  const { error } = await sb.from("budgets").update({ state:sharedState(), rev, updated_by:meId, updated_at:at }).eq("household_id", household.id);
  writing=false;
  if(error){
    if(!retried){ await new Promise(r=>setTimeout(r, 700+Math.random()*900)); return flush(true); }
    setStatus("Couldn’t save","off","Your last change didn’t save. Check your connection; it will try again with your next change.");
  } else { remote={by:meId, at}; showSaved(); }
  if(writeAgain){ writeAgain=false; flush(); }
}
function nameOf(id){
  if(!id) return "";
  if(id===meId) return "you";
  const m=members.find(x=>x.user_id===id); return (m && (m.display_name || (m.email||"").split("@")[0])) || "someone";
}
function showSaved(){
  if(!remote || !remote.at){ setStatus("Saved","","Changes save automatically."); return; }
  const when=new Date(remote.at).toLocaleString("en-NZ",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}), who=nameOf(remote.by);
  setStatus("Saved","",`Changes save automatically. Last change${who?` by ${who}`:""}, ${when}.`);
}
function applyRemote(s){
  const keepUI=state.ui, keepTab=state.tab, ae=document.activeElement;
  const focus = ae && ae.dataset && ae.dataset.f ? {l:ae.dataset.l, i:ae.dataset.i, f:ae.dataset.f} : null, y=window.scrollY;
  state=migrate(clone(s)); state.ui=keepUI; state.tab=keepTab;
  render(); window.scrollTo(0,y);
  if(focus){ const el=$(`[data-l="${focus.l}"][data-i="${focus.i}"][data-f="${focus.f}"]`); if(el) el.focus(); }
}

/* ---------- sign-in screens ---------- */
const brand = `<div class="auth-brand"><div class="logo" aria-hidden="true">J+M</div><div class="brand"><span class="j">Jarden</span><span class="plus">+</span><span class="m">Madi</span><span class="ver">v3</span><small>Fortnightly budget</small></div></div>`;
let authMode="signin";
function showAuth(mode, msg, kind){
  authMode=mode; document.body.classList.add("signed-out"); const el=$("#auth"); el.hidden=false;
  const m = `<div class="msg ${kind||"err"}" id="authMsg">${msg?esc(msg):""}</div>`;
  const tabs = `<div class="auth-tabs"><button type="button" data-auth="signin" aria-pressed="${mode==="signin"}">Sign in</button><button type="button" data-auth="signup" aria-pressed="${mode==="signup"}">Create account</button></div>`;
  let body="";
  if(mode==="setup") body = `<h2>Almost there</h2><p class="lead">This app isn’t connected to its database yet. Open <code class="k">index.html</code>, paste your Supabase project URL and anon key into the two lines marked “CONNECT YOUR DATABASE”, and upload it again.</p>`;
  else if(mode==="signin") body = `<h2>Welcome back</h2><p class="lead">Sign in to see your budget.</p>${tabs}${m}
    <form id="fSignin"><label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit">Sign in</button></form>
    <div class="auth-foot"><button class="linkish" type="button" data-auth="forgot">Forgot your password?</button></div>`;
  else if(mode==="signup") body = `<h2>Create your account</h2><p class="lead">One account each. You’ll share a budget once you’re both in the same household.</p>${tabs}${m}
    <form id="fSignup"><label class="field"><span>Your first name</span><input type="text" name="name" autocomplete="given-name" required></label>
    <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></label>
    <button class="btn primary block" type="submit">Create account</button></form>`;
  else if(mode==="forgot") body = `<h2>Reset your password</h2><p class="lead">We’ll email you a link to choose a new one.</p>${m}
    <form id="fForgot"><label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
    <button class="btn primary block" type="submit">Send reset link</button></form>
    <div class="auth-foot"><button class="linkish" type="button" data-auth="signin">Back to sign in</button></div>`;
  else if(mode==="check") body = `<h2>Check your email</h2><p class="lead">${esc(msg||"")}</p><div class="auth-foot"><button class="linkish" type="button" data-auth="signin">Back to sign in</button></div>`;
  else if(mode==="newpass") body = `<h2>Choose a new password</h2><p class="lead">Then you’ll go straight to your budget.</p>${m}
    <form id="fNewpass"><label class="field"><span>New password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></label>
    <button class="btn primary block" type="submit">Save password</button></form>`;
  else if(mode==="household"){ const email=session?session.user.email:"";
    body = `<h2>Set up your household</h2><p class="lead">A household holds one shared budget. Create it here, then invite your partner from the menu.</p>${m}
    <form id="fHousehold"><label class="field"><span>Household name</span><input type="text" name="name" value="Jarden + Madi" required></label>
    <button class="btn primary block" type="submit">Create household</button></form>
    <div class="auth-foot"><span>Joining someone else’s? Ask them to invite <b>${esc(email)}</b>, then <button class="linkish" type="button" data-auth="recheck">check again</button>.</span><button class="linkish" type="button" data-auth="signout">Sign out</button></div>`; }
  else if(mode==="loading") body = `<p class="lead" style="margin:0">Loading…</p>`;
  el.innerHTML = `<div class="auth-card">${brand}${body}</div>`;
  const first = el.querySelector("form input"); if(first) first.focus();
}
function authMsg(text, kind){ const m=$("#authMsg"); if(m){ m.className="msg "+(kind||"err"); m.textContent=text; } }
function friendly(err){
  const t=(err && (err.message||err.error_description)) || "Something went wrong.";
  if(/invalid login credentials/i.test(t)) return "That email and password don’t match.";
  if(/email not confirmed/i.test(t)) return "Confirm your email first: open the link we sent you, then sign in.";
  if(/already registered|already exists/i.test(t)) return "There’s already an account with that email. Try signing in instead.";
  if(/rate limit|too many/i.test(t)) return "Too many attempts for now. Wait a few minutes and try again.";
  if(/failed to fetch|network/i.test(t)) return "Can’t reach the server. Check your connection and try again.";
  return t;
}
async function busy(form, fn){ const b=form.querySelector('button[type="submit"]'); const old=b.textContent; b.disabled=true; b.textContent="One moment…"; try{ await fn(); } finally { if(b.isConnected){ b.disabled=false; b.textContent=old; } } }
document.addEventListener("submit", async e=>{
  const f=e.target; if(!f.id || !f.id.startsWith("f")) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  if(f.id==="fSignin") await busy(f, async()=>{ const {error}=await sb.auth.signInWithPassword({email:v.email.trim(), password:v.password}); if(error) authMsg(friendly(error)); });
  if(f.id==="fSignup") await busy(f, async()=>{
    const {data, error}=await sb.auth.signUp({email:v.email.trim(), password:v.password, options:{data:{name:v.name.trim()}, emailRedirectTo:here()}});
    if(error) return authMsg(friendly(error));
    if(!data.session) showAuth("check", `We’ve sent a confirmation link to ${v.email.trim()}. Open it on this device to finish creating your account.`); });
  if(f.id==="fForgot") await busy(f, async()=>{ const {error}=await sb.auth.resetPasswordForEmail(v.email.trim(), {redirectTo:here()}); if(error) return authMsg(friendly(error)); showAuth("check", `If there’s an account for ${v.email.trim()}, a reset link is on its way.`); });
  if(f.id==="fNewpass") await busy(f, async()=>{ const {error}=await sb.auth.updateUser({password:v.password}); if(error) return authMsg(friendly(error)); recovering=false; toast("Password updated"); enterApp(); });
  if(f.id==="fHousehold") await busy(f, async()=>{ const {error}=await sb.rpc("create_household", {p_name:v.name}); if(error) return authMsg(friendly(error)); enterApp(); });
  if(f.id==="hhForm") return; // handled below
});
document.addEventListener("click", e=>{
  const a=e.target.closest("[data-auth]"); if(!a) return;
  const m=a.dataset.auth;
  if(m==="signout") signOut(); else if(m==="recheck") enterApp(); else showAuth(m);
});

/* ---------- entering the app ---------- */
async function enterApp(){
  if(entering) return; entering=true;
  try{
    showAuth("loading");
    meId = session.user.id;
    await sb.rpc("accept_invites");
    if(recovering){ showAuth("newpass"); return; }
    const { data:mine, error } = await sb.from("household_members").select("household_id, households(name)").eq("user_id", meId).order("joined_at");
    if(error){ showAuth("signin", friendly(error)); return; }
    if(!mine || !mine.length){ showAuth("household"); return; }
    household = { id:mine[0].household_id, name:(mine[0].households && mine[0].households.name) || "Our budget" };
    await loadMembers();
    const { data:row, error:e2 } = await sb.from("budgets").select("state, rev, updated_by, updated_at").eq("household_id", household.id).maybeSingle();
    if(e2){ showAuth("signin", friendly(e2)); return; }
    if(recovering){ showAuth("newpass"); return; }
    document.body.classList.remove("signed-out"); $("#auth").hidden=true;
    connected=true; loaded=true; canWrite=true;
    if(row && row.state && Object.keys(row.state).length){ hasData=true; lastRev=row.rev; remote={by:row.updated_by, at:row.updated_at}; applyRemote(row.state); }
    else { hasData=false; const ui=state.ui, tab=state.tab; state=migrate(clone(BLANK)); state.ui=ui; state.tab=tab; render(); }
    showSaved(); subscribe();
  } finally { entering=false; }
}
async function loadMembers(){
  const { data } = await sb.from("household_members").select("user_id, display_name, email, role").eq("household_id", household.id).order("joined_at");
  members = data || [];
}
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("budget-"+household.id)
    .on("postgres_changes", { event:"UPDATE", schema:"public", table:"budgets", filter:"household_id=eq."+household.id }, async payload=>{
      const d=payload.new; if(!d || !d.state) return;
      if(d.rev && d.rev===lastRev) return;
      if(writeTimer || writing) return;
      if(!members.find(m=>m.user_id===d.updated_by)) await loadMembers();
      const fromOther = d.updated_by && d.updated_by!==meId;
      hasData=true; lastRev=d.rev; remote={by:d.updated_by, at:d.updated_at};
      applyRemote(d.state); showSaved();
      if(fromOther) toast(`Updated by ${nameOf(d.updated_by)}`);
    })
    .subscribe(status=>{
      if(status==="SUBSCRIBED") showConn("");
      else if(status==="CHANNEL_ERROR" || status==="TIMED_OUT") showConn("Live updates are paused. Your changes still save; refresh to see the other person’s latest.");
    });
}
function teardown(){
  if(channel && sb){ sb.removeChannel(channel); channel=null; }
  clearTimeout(writeTimer); writeTimer=null; household=null; members=[]; meId=null; hasData=false; loaded=false; lastRev=null; remote=null;
  const ui=state.ui, tab=state.tab; state=migrate(clone(BLANK)); state.ui=ui; state.tab=tab;
  $("#app").innerHTML=""; showConn(""); closePop();
}
async function signOut(){
  if(writeTimer){ clearTimeout(writeTimer); writeTimer=null; await flush(); }
  const d=$("#hh"); if(d.open) d.close();
  await sb.auth.signOut();
}

/* ---------- household dialog ---------- */
async function openHousehold(){
  const d=$("#hh"); $("#hhMsg").textContent=""; $("#hhMsg").className="msg";
  $("#hhLead").textContent = `${household.name}: everyone listed here sees and edits the same budget.`;
  await loadMembers();
  $("#hhMembers").innerHTML = members.map(m=>`<li><span>${esc(m.display_name||m.email)}${m.user_id===meId?" (you)":""}<small>${esc(m.email)}</small></span><span class="chip ${m.role==="owner"?"ok":""}">${m.role==="owner"?"Owner":"Member"}</span></li>`).join("");
  await loadInvites();
  if(!d.open) d.showModal();
}
async function loadInvites(){
  const { data } = await sb.from("household_invites").select("id, email, accepted_at").eq("household_id", household.id).is("accepted_at", null).order("created_at");
  $("#hhInvites").innerHTML = (data||[]).map(i=>`<li><span>${esc(i.email)}<small>Waiting for them to sign up and confirm their email</small></span><button class="btn small" type="button" data-uninvite="${esc(i.id)}">Cancel</button></li>`).join("");
  $("#hhInvites").hidden = !(data||[]).length;
}
$("#hhForm").addEventListener("submit", async e=>{
  e.preventDefault(); const email=$("#hhEmail").value.trim(); if(!email) return;
  const { error } = await sb.rpc("invite_member", { p_household:household.id, p_email:email });
  const m=$("#hhMsg");
  if(error){ m.className="msg err"; m.textContent=friendly(error); return; }
  m.className="msg ok"; m.textContent=`Invite saved. Ask them to open this page, choose “Create account” and use ${email}. They’ll join as soon as they sign in.`;
  $("#hhEmail").value=""; loadInvites();
});
$("#hhInvites").addEventListener("click", async e=>{ const b=e.target.closest("[data-uninvite]"); if(!b) return; await sb.from("household_invites").delete().eq("id", b.dataset.uninvite); loadInvites(); });
$("#hhClose").addEventListener("click", ()=>$("#hh").close());
$("#hhSignOut").addEventListener("click", signOut);

document.addEventListener("keydown", e=>{ if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); if(writeTimer){ clearTimeout(writeTimer); writeTimer=null; flush(); } else if(household) toast("Everything’s already saved. Changes save as you go."); } });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && writeTimer){ clearTimeout(writeTimer); writeTimer=null; flush(); } });
window.addEventListener("beforeunload", e=>{ if(writeTimer || writing){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("hashchange", ()=>{ const t=tabFromHash(); if(t && t!==state.tab){ state.tab=t; if(household) render(); window.scrollTo({top:0}); } });

function boot(){
  applyUI();
  if(/type=recovery/.test(location.hash)) recovering=true;
  if(!configured || !window.supabase){ showAuth("setup"); return; }
  sb = window.supabase.createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim(), { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  showAuth("loading");
  sb.auth.onAuthStateChange((event, s)=>{
    // Work is deferred so it never runs inside Supabase's own callback.
    setTimeout(()=>{
      if(event==="PASSWORD_RECOVERY"){ recovering=true; session=s; showAuth("newpass"); return; }
      if(event==="SIGNED_OUT"){ session=null; teardown(); showAuth("signin"); return; }
      if(!s){ if(event==="INITIAL_SESSION") showAuth("signin"); return; }
      const wasSignedIn = !!session; session=s;
      if(!recovering && !wasSignedIn) enterApp();
    }, 0);
  });
}
boot();
})();
</script>
