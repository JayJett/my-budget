<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&display=swap" rel="stylesheet">
<meta name="description" content="A friendly household budget visualiser.">
<link rel="stylesheet" href="css/app.css">
<!-- Supabase JS client: a pinned version, loaded before the app's own code. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!-- The app itself: js/main.js and the files it imports. No build step. -->
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="auth" hidden></div>
<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="logo" aria-hidden="true"></div>
      <h1 class="brand" id="brandNames">Budget</h1>
      <div class="save-area">
        <span class="save-state" id="saveState" tabindex="0"><span class="dot"></span><span class="txt" id="saveText">Loading…</span></span>
        <button class="btn icon" id="menuBtn" type="button" aria-label="More options" aria-haspopup="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="13" cy="8" r="1.6"/></svg></button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="meter" id="meter" hidden></div>
  </div>
</header>
<div class="conn-wrap"><div class="conn" id="conn" hidden></div></div>
<main id="app"></main>
<div class="pop" id="pop" hidden></div>
<div class="tt" id="tt" role="tooltip"></div>
<dialog id="sheet" class="sheet" aria-label="Settings"></dialog>
<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgP"></p><div class="acts"><button class="btn" type="button" id="dlgNo">Keep it</button><button class="btn danger" type="button" id="dlgYes">Remove</button></div></dialog>
<input type="file" id="importFile" accept=".html,.htm,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
